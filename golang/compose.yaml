services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: golang_scaffold
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d golang_scaffold"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
