[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "python-scaffold"
version = "0.1.0"
description = "Repeatable Python starter scaffold"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.15,<2",
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "bandit>=1.8,<2",
  "basedpyright>=1.29,<2",
  "httpx>=0.28,<1",
  "hypothesis>=6.0,<7",
  "pip-audit>=2.8,<3",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6.0,<8",
  "ruff>=0.9,<1",
  "ty>=0.0.1a21,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/python_scaffold"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
  "unit: fast unit tests",
  "property: generative tests using Hypothesis",
  "integration: tests that require external infrastructure",
  "llm: tests that exercise LLM-facing behavior",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
ignore = ["E501"]

[tool.basedpyright]
pythonVersion = "3.12"
reportAny = false
reportExplicitAny = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownLambdaType = false
